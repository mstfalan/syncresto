name: Windows Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'master'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        # 11 Haz 2026: GitHub runner yeni MSVC'ye (VS18/14.51) güncellendi; eski
        # audioplayers_windows + permission_handler_windows plugin'leri <experimental/coroutine>
        # kullandığı için STL1011 deprecation HATASI veriyor. CL env ile uyarıyı sustur
        # (resmi öneri, plugin kodlarına dokunmaz). _CRT/_SILENCE define MSVC'ye geçer.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Bundle VC++ runtime DLLs (fallback + safety-net)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = "build\windows\x64\runner\Release"
          # CMake InstallRequiredSystemLibraries zaten kopyalamis olabilir; bu adim idempotent
          # uzerine yazar. CMake bir surum surprizinde tutmazsa BU kurtarir. VCToolsRedistDir =
          # derleme env'inin redist'i -> derleyen toolset ile SURUM ESLESMESI en yuksek kaynak.
          $crtDir = $null
          if ($env:VCToolsRedistDir) {
            $crtDir = Get-ChildItem -Path (Join-Path $env:VCToolsRedistDir "x64") -Directory `
              -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $crtDir) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -property installationPath
              if ($vsPath) {
                $crtDir = Get-ChildItem -Path "$vsPath\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
                  Sort-Object { [version]$_.Name } -Descending |
                  ForEach-Object { Get-ChildItem -Path "$($_.FullName)\x64" -Directory `
                    -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
                  Select-Object -First 1 -ExpandProperty FullName
              }
            }
          }
          if ($crtDir -and (Test-Path $crtDir)) {
            Write-Host "CRT redist kaynagi: $crtDir"
            Copy-Item -Path "$crtDir\*.dll" -Destination $rel -Force
            Write-Host "Kopyalanan CRT DLL'leri:"
            Get-ChildItem "$rel\*140*.dll" | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host "::warning::CRT redist klasoru bulunamadi; CMake kopyasina guveniliyor. Guard dogrulayacak."
          }

      - name: Create self-signed certificate and sign exe
        shell: pwsh
        run: |
          # Self-signed code signing certificate olustur (CN=SyncResto)
          $cert = New-SelfSignedCertificate `
            -Subject "CN=SyncResto, O=SyncResto, C=TR" `
            -Type CodeSigningCert `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -HashAlgorithm SHA256 `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(3)

          $thumbprint = $cert.Thumbprint
          Write-Host "Cert Thumbprint: $thumbprint"

          # Sertifikayi PFX olarak kaydet (timestamp icin gerekli degil ama referans)
          $pwd = ConvertTo-SecureString -String "syncresto-temp-pass" -Force -AsPlainText
          Export-PfxCertificate -Cert "Cert:\CurrentUser\My\$thumbprint" -FilePath "$env:RUNNER_TEMP\syncresto-cert.pfx" -Password $pwd | Out-Null

          # signtool yolunu bul
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]($_.Directory.Parent.Name) } -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          Write-Host "signtool: $signtool"

          # SyncResto POS.exe'yi imzala
          $exePath = "build\windows\x64\runner\Release\SyncResto POS.exe"
          if (-not (Test-Path $exePath)) {
            # Alternatif isim (pubspec'teki app name'e gore)
            $exePath = Get-ChildItem "build\windows\x64\runner\Release\*.exe" | Select-Object -First 1 -ExpandProperty FullName
          }
          Write-Host "Signing: $exePath"

          & $signtool sign `
            /fd SHA256 `
            /td SHA256 `
            /tr "http://timestamp.digicert.com" `
            /sha1 $thumbprint `
            /d "SyncResto POS" `
            /du "https://syncresto.com" `
            "$exePath"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "signtool sign basarisiz oldu (exit $LASTEXITCODE)"
            exit 1
          }

          # Imza dogrulama: self-signed cert oldugu icin /pa (Default Authentication Verification Policy)
          # trusted root chain bekler ve fail eder. Sadece imza varligini ve timestamp'i dogrula.
          Write-Host "--- Imza bilgisi ---"
          & $signtool verify /v "$exePath" 2>&1 | Out-Host
          # Exit kodunu yutuyoruz; "Successfully signed" yukarida zaten dogrulandi
          $LASTEXITCODE = 0

      - name: Create zip package
        shell: pwsh
        run: |
          cd build/windows/x64/runner/Release
          Compress-Archive -Path * -DestinationPath ../../../../../SyncResto-Windows.zip -Force

      - name: Verify runtime DLLs are in the zip (DLL yoksa veya x64 degilse build FAIL)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $required = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $optional = @("msvcp140_1.dll", "msvcp140_2.dll")
          $extract = Join-Path $env:RUNNER_TEMP "zipcheck"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path "SyncResto-Windows.zip" -DestinationPath $extract -Force

          # PE header'dan mimari oku: 0x8664 = x64, 0x14c = x86
          function Get-PeMachine([string]$path) {
            $bytes = [System.IO.File]::ReadAllBytes($path)
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            return [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          }

          # DLL'ler exe KOKUNDE (data/ altinda degil) olmali -> Release kokunu bul
          $exe = Get-ChildItem -Path $extract -Filter "SyncResto POS.exe" -Recurse | Select-Object -First 1
          if (-not $exe) { Write-Host "::error::SyncResto POS.exe zip'te bulunamadi"; exit 1 }
          $root = $exe.DirectoryName
          Write-Host "Exe kok klasoru: $root"

          $missing = @()
          foreach ($dll in $required) {
            $p = Join-Path $root $dll
            if (-not (Test-Path $p)) { $missing += $dll; continue }
            $m = Get-PeMachine $p
            if ($m -ne 0x8664) {
              Write-Host "::error::$dll x64 DEGIL (machine=0x$($m.ToString('x'))) -> exe kokunde yanlis mimari"
              exit 1
            }
            if ((Get-Item $p).Length -eq 0) { Write-Host "::error::$dll bos (0 byte)"; exit 1 }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::VC++ runtime DLL(ler) exe kokunde EKSIK: $($missing -join ', ')"
            Write-Host "Kokteki DLL'ler:"
            Get-ChildItem -Path $root -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
            exit 1
          }

          Write-Host "OK: Tum ZORUNLU VC++ runtime DLL'leri x64 ve exe kokunde:"
          foreach ($dll in $required) { Write-Host "  [x] $dll" }
          foreach ($dll in $optional) {
            $p = Join-Path $root $dll
            if (Test-Path $p) { Write-Host "  [x] $dll (opsiyonel, mevcut)" }
            else { Write-Host "::warning::$dll opsiyonel, gelmedi (STL guncellemesi zorunlu kilarsa izle)" }
          }

      - name: Calculate SHA-256 checksum
        id: checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Path "SyncResto-Windows.zip" -Algorithm SHA256).Hash
          Write-Host "SHA256: $hash"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows Build (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SyncResto-Windows
          path: SyncResto-Windows.zip
          retention-days: 30

      # 11 Tem 2026: Sürüm YAYINLAMA politikası — pubspec version'a karşılık gelen
      # GitHub Release/tag ZATEN VARSA yeni release OLUŞTURMA (mevcut çalışan kasalara
      # "yeni sürüm var" sinyali gitmesin; auto-update tetiklenmesin). Sadece bump edilmiş
      # (release'i olmayan) yeni bir sürümde release yayınlanır. Artifact her build'de üretilir
      # (elle indirilebilir), release opsiyoneldir.
      - name: Check if release already exists
        id: relcheck
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release $TAG ZATEN VAR -> yeni surum yayinlanmayacak (sadece artifact)."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release $TAG yok -> yeni surum yayinlanacak."
          fi

      - name: Create GitHub Release
        if: steps.relcheck.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SyncResto POS v${{ steps.version.outputs.version }}
          body: |
            ## SyncResto POS v${{ steps.version.outputs.version }}

            ### Windows
            - `SyncResto-Windows.zip` dosyasini indirip cikartin
            - Imzalayan: SyncResto (self-signed)
            - SHA-256: `${{ steps.checksum.outputs.sha256 }}`

            ### Degisiklikler
            - Windows guncelleme akisi: robocopy /MIR ile mevcut dosyalarin uzerine yazilir
            - macOS guncelleme: PlistBuddy ile sürüm dogrulamasi + rollback
            - Self-signed code signing (SyncResto publisher)
            - PIN ekrani buyutuldu, dokunma sorunlari giderildi
            - Parcali odeme dialog: kirmizi "ODENMEDI" badge, X kapatma otomatik mutfaga gonder
            - Masalar ekraninda buyuk kilit iconu (garson degistir)
          files: SyncResto-Windows.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
